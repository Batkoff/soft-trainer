{% if page.paginator.num_pages > 1 %}<nav class="page-pagination" aria-label="Страницы списка"><span>Страница {{ page.number }} из {{ page.paginator.num_pages }} · {{ page.paginator.count }} записей</span><div>{% if page.has_previous %}<a class="button small" href="{{ previous_url }}">Назад</a>{% endif %}{% if page.has_next %}<a class="button small" href="{{ next_url }}">Далее</a>{% endif %}</div></nav>{% endif %}
